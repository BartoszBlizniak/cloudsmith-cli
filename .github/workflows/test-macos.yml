name: Test (macOS)

# The whole unit suite, and the clean-install smoke test of the built wheel,
# on macOS. A separate workflow from Test, because macOS runners are scarce
# and can queue for minutes: in Test that would hold up every other result.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"
  merge_group:

permissions:
  contents: read

concurrency:
  group: test-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-macos:
    name: Full unit suite on macOS (Python 3.14)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --python 3.14

      # What differs by platform: paths, keyring backends, console-script
      # launchers, file locking and permissions.
      - name: Run pytest
        run: uv run pytest cloudsmith_cli -m "not integration"

      - name: Clean-install smoke test of the built wheel
        if: ${{ !cancelled() }}
        run: uv run python .github/scripts/clean_install.py --python 3.14
